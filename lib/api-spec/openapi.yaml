openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: appointments
    description: Appointment request operations
  - name: admin
    description: Internal admin operations (Phase 3 — will require admin role)
paths:
  /appointment-requests:
    post:
      operationId: createAppointmentRequest
      tags: [appointments]
      summary: Submit a public appointment request
      description: Accepts a new patient intake form submission and stores it for staff review. No authentication required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentRequestInput"
      responses:
        "201":
          description: Request created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentRequestCreated"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /admin/requests:
    get:
      operationId: adminListRequests
      tags: [admin]
      summary: List appointment requests (paginated)
      description: Returns appointment requests ordered by newest first. Supports status filtering and cursor-less page/pageSize pagination.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RequestStatus"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-indexed)
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of records per page (max 100)
      responses:
        "200":
          description: Paginated list of requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppointmentRequest"
                  total:
                    type: integer
                    description: Total records matching the filter
                  page:
                    type: integer
                    description: Current page number
                  pageSize:
                    type: integer
                    description: Records per page
                  totalPages:
                    type: integer
                    description: Total number of pages
                required: [requests, total, page, pageSize, totalPages]
  /admin/requests/counts:
    get:
      operationId: adminGetRequestCounts
      tags: [admin]
      summary: Get request counts by status
      responses:
        "200":
          description: Counts per status
          content:
            application/json:
              schema:
                type: object
                properties:
                  counts:
                    type: object
                    additionalProperties:
                      type: integer
                required: [counts]
  /admin/requests/{id}:
    get:
      operationId: adminGetRequest
      tags: [admin]
      summary: Get a single appointment request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The appointment request
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    $ref: "#/components/schemas/AppointmentRequest"
                required: [request]
        "404":
          description: Not found
  /admin/requests/{id}/status:
    patch:
      operationId: adminUpdateRequestStatus
      tags: [admin]
      summary: Update appointment request status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: "#/components/schemas/RequestStatus"
              required: [status]
      responses:
        "200":
          description: Updated request summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    type: object
                    properties:
                      id:
                        type: string
                      status:
                        $ref: "#/components/schemas/RequestStatus"
                    required: [id, status]
                required: [request]
        "400":
          description: Validation error
        "404":
          description: Not found
  /admin/providers:
    get:
      operationId: adminListProviders
      tags: [admin]
      summary: List all provider profiles
      description: Returns all providers sorted by name. Requires admin or collaborator role.
      responses:
        "200":
          description: List of providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Provider"
                required: [providers]
    post:
      operationId: adminCreateProvider
      tags: [admin]
      summary: Create a new provider profile
      description: Creates a new provider profile. Requires admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderInput"
      responses:
        "201":
          description: Provider created
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider:
                    $ref: "#/components/schemas/Provider"
                required: [provider]
        "400":
          description: Validation error
  /admin/providers/active:
    get:
      operationId: adminGetActiveProvider
      tags: [admin]
      summary: Get the first active provider profile (legacy)
      description: Returns the most recently created active provider. Kept for backward compatibility.
      responses:
        "200":
          description: The active provider or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider:
                    oneOf:
                      - $ref: "#/components/schemas/Provider"
                      - type: "null"
                required: [provider]
    put:
      operationId: adminUpsertProvider
      tags: [admin]
      summary: Upsert the active provider profile (legacy)
      description: Updates the most recent provider row or creates one. Kept for backward compatibility.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderInput"
      responses:
        "200":
          description: Saved provider
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider:
                    $ref: "#/components/schemas/Provider"
                required: [provider]
        "400":
          description: Validation error
  /admin/providers/{id}:
    put:
      operationId: adminUpdateProvider
      tags: [admin]
      summary: Update a provider profile by ID
      description: Updates a specific provider by their UUID. Requires admin role.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderInput"
      responses:
        "200":
          description: Updated provider
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider:
                    $ref: "#/components/schemas/Provider"
                required: [provider]
        "400":
          description: Validation error
        "404":
          description: Provider not found
  /providers/me:
    get:
      operationId: getMyProviderProfile
      tags: [admin]
      summary: Get the signed-in provider's own profile
      description: Returns the provider record linked to the currently authenticated provider user.
      responses:
        "200":
          description: The provider's own profile or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider:
                    oneOf:
                      - $ref: "#/components/schemas/Provider"
                      - type: "null"
                required: [provider]
    put:
      operationId: updateMyProviderProfile
      tags: [admin]
      summary: Update the signed-in provider's own profile
      description: Allows a provider to update their own linked profile record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderInput"
      responses:
        "200":
          description: Updated provider profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider:
                    $ref: "#/components/schemas/Provider"
                required: [provider]
        "400":
          description: Validation error
        "404":
          description: No provider profile linked to this account
components:
  schemas:
    RequestStatus:
      type: string
      enum: [new, under_review, approved, rejected, invited]
    AppointmentRequestInput:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        serviceInterest:
          type: string
          enum: [therapy, medication, not_sure]
        preferredTime:
          type: string
        preferredContactMethod:
          type: string
          enum: [phone, email]
        isNewPatient:
          type: boolean
        contactConsent:
          type: boolean
      required:
        - fullName
        - email
        - phone
        - serviceInterest
        - preferredTime
        - contactConsent
    AppointmentRequestCreated:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
      required:
        - id
        - status
    AppointmentRequest:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
        preferredTime:
          type: string
        serviceInterest:
          type: string
        preferredContactMethod:
          type: string
          nullable: true
        isNewPatient:
          type: boolean
          nullable: true
        contactConsent:
          type: boolean
        status:
          $ref: "#/components/schemas/RequestStatus"
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        reviewedByAdminId:
          type: string
          nullable: true
      required:
        - id
        - createdAt
        - updatedAt
        - fullName
        - email
        - phone
        - preferredTime
        - serviceInterest
        - contactConsent
        - status
    ProviderInput:
      type: object
      properties:
        fullName:
          type: string
        credentials:
          type: string
        licenseState:
          type: string
        bio:
          type: string
        profileImageUrl:
          type: string
          nullable: true
        isActive:
          type: boolean
      required:
        - fullName
    Provider:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        userId:
          type: string
          nullable: true
          description: Linked user account ID (set when provider accepts an invite)
        fullName:
          type: string
        credentials:
          type: string
        licenseState:
          type: string
        bio:
          type: string
        profileImageUrl:
          type: string
          nullable: true
        isActive:
          type: boolean
      required:
        - id
        - createdAt
        - updatedAt
        - fullName
        - credentials
        - licenseState
        - bio
        - isActive
    ValidationError:
      type: object
      properties:
        issues:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            required:
              - field
              - message
      required:
        - issues
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
